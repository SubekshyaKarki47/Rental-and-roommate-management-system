<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgBlob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Soft Cloud/Blob -->
  <path d="M40 120 Q30 50 120 40 Q240 20 320 60 Q380 90 370 160 Q350 220 250 230 Q100 240 50 180 Z" fill="url(#bgBlob)" opacity="0.7" />

  <!-- Person 1 (Left - young man in blue giving high five) -->
  <g id="person1">
    <!-- Legs -->
    <rect x="90" y="140" width="14" height="80" rx="7" fill="#1E293B" />
    <rect x="110" y="140" width="14" height="80" rx="7" fill="#334155" />
    <!-- Shoes -->
    <rect x="84" y="212" width="22" height="10" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <rect x="108" y="212" width="22" height="10" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
    <!-- Body -->
    <path d="M85 90 C85 80, 130 80, 130 90 L126 148 L88 148 Z" fill="url(#accentBlue)" />
    <!-- Left Arm -->
    <path d="M86 95 L72 135 L80 140 L94 100 Z" fill="#2563EB" />
    <!-- Raised Right Arm (High Five) -->
    <path d="M125 95 L165 50 L174 58 L134 105 Z" fill="#2563EB" />
    <!-- High Five Hand -->
    <circle cx="174" cy="48" r="8" fill="#FBBF24" />
    <!-- Head & Hair -->
    <circle cx="108" cy="60" r="16" fill="#FBBF24" />
    <path d="M96 55 C96 42, 120 42, 120 55 C120 48, 114 44, 106 45 C100 46, 96 50, 96 55 Z" fill="#0F172A" />
  </g>

  <!-- Person 2 (Center - person receiving high five / smiling) -->
  <g id="person2">
    <!-- Legs -->
    <rect x="180" y="145" width="13" height="75" rx="6.5" fill="#64748B" />
    <rect x="200" y="145" width="13" height="75" rx="6.5" fill="#475569" />
    <!-- Shoes -->
    <rect x="176" y="212" width="20" height="9" rx="4.5" fill="#F8FAFC" stroke="#334155" stroke-width="2" />
    <rect x="198" y="212" width="20" height="9" rx="4.5" fill="#F8FAFC" stroke="#334155" stroke-width="2" />
    <!-- Body / Lavender sweater -->
    <path d="M175 95 C175 84, 218 84, 218 95 L215 150 L178 150 Z" fill="#818CF8" />
    <!-- Raised Left Arm meeting the high five -->
    <path d="M178 100 L170 54 L180 50 L188 105 Z" fill="#6366F1" />
    <!-- Other Hand on Hip -->
    <path d="M216 100 L232 125 L222 130 L212 110 Z" fill="#6366F1" />
    <!-- Head & Hair -->
    <circle cx="196" cy="62" r="15" fill="#FCD34D" />
    <path d="M184 56 C184 45, 208 45, 208 56 C206 50, 194 48, 184 56 Z" fill="#78350F" />
  </g>

  <!-- Sparkles around the High Five -->
  <path d="M176 30 L178 22 L180 30 L188 32 L180 34 L178 42 L176 34 L168 32 Z" fill="#F59E0B" />
  <circle cx="196" cy="34" r="3" fill="#60A5FA" />
  <circle cx="160" cy="40" r="2.5" fill="#F43F5E" />

  <!-- Person 3 (Right - happy roommate in yellow top cheering) -->
  <g id="person3">
    <!-- Legs -->
    <rect x="265" y="145" width="13" height="75" rx="6.5" fill="#1E293B" />
    <rect x="285" y="145" width="13" height="75" rx="6.5" fill="#0F172A" />
    <!-- Shoes -->
    <rect x="262" y="212" width="20" height="9" rx="4.5" fill="#F43F5E" />
    <rect x="283" y="212" width="20" height="9" rx="4.5" fill="#F43F5E" />
    <!-- Body -->
    <path d="M260 92 C260 82, 304 82, 304 92 L300 150 L264 150 Z" fill="url(#accentYellow)" />
    <!-- Arms raised in celebration -->
    <path d="M262 98 L244 80 L252 74 L270 94 Z" fill="#F59E0B" />
    <path d="M302 98 L320 80 L328 86 L308 104 Z" fill="#F59E0B" />
    <!-- Head & Long Hair -->
    <circle cx="282" cy="62" r="15" fill="#FBBF24" />
    <path d="M268 56 C268 40, 296 40, 296 56 C300 70, 296 85, 296 90 C290 85, 274 85, 268 90 C268 80, 266 65, 268 56 Z" fill="#1E1B4B" />
  </g>
</svg>
